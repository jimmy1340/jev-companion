name: CI
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  python:
    # ubuntu-latest is Ubuntu 26.04. actions/setup-python publishes Python 3.9
    # for 24.04 only (3.9 is end-of-life, so there is no 26.04 build). Pin the
    # image so CI still installs 3.9, the Command Line Tools floor the app runs.
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.9'
      - run: python -m unittest discover -s macos/backend/tests -v
  macos:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - run: bash macos/test.sh
      - run: bash macos/build.sh
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - run: dotnet run --project windows/Tests/Jev.Tests.csproj -c Release
      - run: dotnet publish windows/App/Jev.Windows.csproj -c Release -r win-x64 --self-contained true -o dist/windows
